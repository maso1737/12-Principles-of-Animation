<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>03 STAGING — Diagonal Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0610;
    --panel:rgba(21,11,31,.72);
    --panel-solid:#150B1F;
    --line:rgba(255,46,126,.16);
    --line-soft:rgba(255,255,255,.07);
    --ink:#F4ECFF;
    --muted:#7A6690;
    --muted-2:#5A4870;
    --pink:#FF2E7E;
    --cyan:#33E3FF;
    --amber:#FFA23D;
    --purple:#B06CFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP",system-ui,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ---------- STAGE ---------- */
  #stage-wrap{position:relative;flex:1 1 auto;min-height:0}
  #stage{position:absolute;inset:0;width:100%;height:100%;display:block;background:#060309}

  /* top overlay */
  #top{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:18px 20px;pointer-events:none;
    background:linear-gradient(180deg,rgba(6,3,9,.7),rgba(6,3,9,0));
  }
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand .k{
    font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:clamp(20px,3.4vw,30px);letter-spacing:.12em;line-height:.95;
    text-transform:uppercase;
  }
  .brand .k em{font-style:normal;color:var(--pink)}
  .brand .sub{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.28em;
    color:var(--muted);text-transform:uppercase;
  }
  #phase{
    text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end;
  }
  #phase .role-en{
    font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:clamp(20px,3.6vw,32px);letter-spacing:.14em;line-height:.9;
    text-transform:uppercase;color:var(--ink);
    transition:color .4s;
  }
  #phase .role-jp{
    font-family:"Noto Sans JP",sans-serif;font-weight:700;
    font-size:13px;letter-spacing:.34em;color:var(--cyan);
  }
  #phase .idx{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;
    color:var(--muted-2);
  }

  /* bottom hint */
  #hint{
    position:absolute;left:0;right:0;bottom:12px;z-index:4;text-align:center;
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.2em;
    color:var(--muted-2);pointer-events:none;text-transform:uppercase;
    transition:opacity .4s;
  }
  kbd{
    font-family:"IBM Plex Mono",monospace;font-size:10px;
    border:1px solid var(--line);border-radius:4px;padding:1px 6px;
    color:var(--muted);background:rgba(255,255,255,.03);
  }

  /* ---------- CONSOLE ---------- */
  #console{
    flex:0 0 auto;background:var(--panel-solid);
    border-top:1px solid var(--line);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:12px;
  }

  /* editor (collapsible) */
  #editor{
    display:grid;grid-template-columns:1fr;gap:12px;
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .32s ease,opacity .25s ease;
  }
  #editor.open{opacity:1;overflow:hidden}
  .edit-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .edit-label{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.2em;
    color:var(--muted);text-transform:uppercase;min-width:84px;
  }
  .patbtns{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .patbtn{
    font-family:"Barlow Condensed",sans-serif;font-weight:600;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);background:rgba(255,255,255,.03);
    border:1px solid var(--line-soft);border-radius:7px;
    padding:7px 11px;cursor:pointer;transition:.16s;
  }
  .patbtn:hover{color:var(--ink);border-color:var(--line)}
  .patbtn.on{
    color:#0B0610;background:var(--pink);border-color:var(--pink);
    box-shadow:0 0 18px rgba(255,46,126,.4);
  }
  .sliders{display:flex;gap:18px;flex:1;flex-wrap:wrap;align-items:center}
  .slider{display:flex;align-items:center;gap:10px;flex:1;min-width:160px}
  .slider span{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
    color:var(--muted);min-width:62px;text-transform:uppercase;
  }
  .slider span b{color:var(--cyan);font-weight:500}
  .slider.rot{gap:8px}
  .mini{
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--cyan);background:rgba(51,227,255,.08);
    border:1px solid rgba(51,227,255,.32);border-radius:5px;
    padding:5px 8px;cursor:pointer;transition:.14s;flex:0 0 auto;
  }
  .mini:hover{background:rgba(51,227,255,.18);color:var(--ink)}
  .mini:active{transform:scale(.94)}
  .mini.flash{animation:mflash .4s}
  @keyframes mflash{0%{background:var(--cyan);color:#0B0610}100%{}}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--pink),var(--cyan));cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:var(--ink);border:2px solid var(--bg);
    box-shadow:0 0 10px rgba(255,255,255,.5);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:15px;height:15px;border-radius:50%;background:var(--ink);
    border:2px solid var(--bg);box-shadow:0 0 10px rgba(255,255,255,.5);cursor:pointer;
  }
  .colors{display:flex;gap:8px}
  .swatch{
    width:24px;height:24px;border-radius:50%;cursor:pointer;
    border:2px solid transparent;transition:.15s;
  }
  .swatch.on{border-color:var(--ink);transform:scale(1.12)}

  /* cue stack */
  #stack-row{display:flex;align-items:stretch;gap:10px}
  #stack{
    display:flex;gap:8px;flex:1;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
  }
  #stack::-webkit-scrollbar{display:none}
  .cue{
    flex:1 1 0;min-width:96px;position:relative;cursor:pointer;
    background:rgba(255,255,255,.025);
    border:1px solid var(--line-soft);border-radius:10px;
    padding:9px 10px 10px;display:flex;flex-direction:column;gap:6px;
    transition:.18s;overflow:hidden;
  }
  .cue:hover{border-color:var(--line);background:rgba(255,255,255,.05)}
  .cue.live{
    border-color:var(--pink);
    box-shadow:0 0 0 1px var(--pink),0 0 22px rgba(255,46,126,.28) inset;
  }
  .cue.dragging{opacity:.4}
  .cue .top-line{display:flex;align-items:center;justify-content:space-between}
  .cue .num{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
    color:var(--muted);
  }
  .cue.live .num{color:var(--pink)}
  .cue .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .cue .pat{
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--ink);line-height:1;
  }
  .cue .role{
    font-family:"Noto Sans JP",sans-serif;font-size:10px;letter-spacing:.18em;
    color:var(--muted-2);
  }
  .cue .role b{color:var(--cyan);font-weight:500}
  .cue .meter{
    height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;
  }
  .cue .meter i{display:block;height:100%;background:var(--pink);transition:width .2s}

  /* GO */
  #go{
    flex:0 0 auto;width:108px;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(160deg,#FF2E7E,#C81E8C);
    color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:24px;letter-spacing:.16em;text-transform:uppercase;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    box-shadow:0 0 26px rgba(255,46,126,.45);transition:.1s;
  }
  #go small{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.2em;opacity:.8;font-weight:500}
  #go:active{transform:scale(.96);box-shadow:0 0 36px rgba(255,46,126,.7)}
  #go.flash{animation:flash .35s}
  @keyframes flash{0%{filter:brightness(2.4)}100%{filter:brightness(1)}}

  /* toolbar mini */
  #tools{display:flex;align-items:center;gap:10px;justify-content:space-between}
  #tools .left{display:flex;align-items:center;gap:8px}
  .tbtn{
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted);background:transparent;
    border:1px solid var(--line-soft);border-radius:6px;padding:5px 9px;cursor:pointer;
    transition:.15s;
  }
  .tbtn:hover{color:var(--ink);border-color:var(--line)}
  .tbtn.active{color:var(--cyan);border-color:rgba(51,227,255,.4)}

  @media (max-width:560px){
    .cue{min-width:78px;padding:8px}
    .cue .role{display:none}
    #go{width:84px;font-size:20px}
    .edit-label{min-width:64px}
  }
  @media (prefers-reduced-motion:reduce){
    #editor{transition:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="top">
      <div class="brand">
        <div class="k">03 <em>Staging</em></div>
        <div class="sub">Diagonal Light · Direct the screen</div>
      </div>
      <div id="phase">
        <div class="role-en" id="roleEn">Still</div>
        <div class="role-jp" id="roleJp">静</div>
        <div class="idx" id="roleIdx">CUE 01 / 06</div>
      </div>
    </div>
    <div id="hint"><kbd>SPACE</kbd> or <kbd>GO</kbd> to advance · tap a cue to edit</div>
  </div>

  <div id="console">
    <div id="editor">
      <div class="edit-row">
        <div class="edit-label">Pattern</div>
        <div class="patbtns" id="patbtns"></div>
      </div>
      <div class="edit-row">
        <div class="edit-label">Control</div>
        <div class="sliders">
          <label class="slider"><span>INT <b id="vInt">—</b></span><input type="range" id="sInt" min="0" max="100"></label>
          <label class="slider"><span>SPD <b id="vSpd">—</b></span><input type="range" id="sSpd" min="0" max="100"></label>
          <label class="slider rot"><span>ROT <b id="vRot">—</b></span><input type="range" id="sRot" min="-180" max="180" step="15" title="ダブルクリックで既定 -30° に戻す"><button class="mini" id="rotAll" title="全CUEをこの角度にそろえる">ALL</button></label>
        </div>
      </div>
      <div class="edit-row">
        <div class="edit-label">Color</div>
        <div class="colors" id="colors"></div>
      </div>
    </div>

    <div id="stack-row">
      <div id="stack"></div>
      <button id="go">GO<small>SPACE</small></button>
    </div>

    <div id="tools">
      <div class="left">
        <button class="tbtn" id="rewind">⏮ TOP</button>
        <button class="tbtn" id="reset">RESET ARC</button>
        <button class="tbtn" id="editToggle">EDIT</button>
      </div>
      <div class="left">
        <button class="tbtn active" id="loopBtn">LOOP</button>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   03 STAGING — Diagonal Light System (2D)
   画面そのものを演出する。ライトは配置済み、
   ユーザーは「点灯順・強度・速度(+回転)」だけを操る。
   ============================================================ */

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha:false });
let W=0,H=0,DPR=1, HALF=0, SPREAD=0;

/* ---- palette (beam colors) ---- */
const COLORS = {
  purple:{r:176,g:108,b:255},
  cyan  :{r: 51,g:227,b:255},
  amber :{r:255,g:162,b: 61},
  pink  :{r:255,g: 46,b:126},
  blue  :{r: 91,g:140,b:255},
  white :{r:255,g:248,b:255},
};
const COLOR_KEYS = ['purple','cyan','amber','pink','blue'];
const rgba=(c,a)=>`rgba(${c.r|0},${c.g|0},${c.b|0},${a})`;
const mix=(a,b,t)=>({r:a.r+(b.r-a.r)*t,g:a.g+(b.g-a.g)*t,b:a.b+(b.b-a.b)*t});

/* ---- pattern catalog ---- */
const PATTERNS = ['THIN','BAR','GRADATION','DOT','DEPTHBAR','WIDE'];
const PATTERN_LABEL = {THIN:'THIN',BAR:'BAR',GRADATION:'GRAD',DOT:'DOT',DEPTHBAR:'DEPTH',WIDE:'WIDE'};

/* ---- dramatic roles per slot index (the lesson) ---- */
const ROLES = [
  {en:'Still',  jp:'静',  c:'#7A6690'},
  {en:'Omen',   jp:'予兆', c:'#5B8CFF'},
  {en:'Flow',   jp:'流れ', c:'#33E3FF'},
  {en:'Build',  jp:'蓄積', c:'#FFA23D'},
  {en:'Surge',  jp:'寄せ', c:'#FF8A3D'},
  {en:'Release',jp:'解放', c:'#FF2E7E'},
];

/* ---- default arc (静→予兆→流れ→蓄積→寄せ→解放) ---- */
function defaultCues(){
  return [
    {pattern:'THIN',     color:'purple', int:22, spd:14, rot:-30},
    {pattern:'DOT',      color:'cyan',   int:34, spd:28, rot:-30},
    {pattern:'BAR',      color:'amber',  int:54, spd:46, rot:-30},
    {pattern:'GRADATION',color:'amber',  int:68, spd:60, rot:-30},
    {pattern:'DEPTHBAR', color:'pink',   int:80, spd:78, rot:-30},
    {pattern:'WIDE',     color:'pink',   int:100,spd:40, rot:-30},
  ];
}

/* ---- state ---- */
let cues = defaultCues();
let playhead = 0;
let selected = -1;
let loop = true;
let editorOpen = false;

/* transition between cues */
let trans = { active:false, from:0, to:0, t:0, dur:720, blast:0 };

/* ============================================================
   RESIZE
   ============================================================ */
function resize(){
  const wrap = document.getElementById('stage-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  HALF = Math.hypot(W,H)/2 + 60;
  SPREAD = Math.min(W,H)*0.42;
}
window.addEventListener('resize', resize);

/* ============================================================
   DRAW PRIMITIVES (rotated diagonal frame, additive)
   ============================================================ */
function withRot(deg, fn){
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(deg*Math.PI/180);
  fn();
  ctx.restore();
}

// a vertical glowing beam at local x, emanating from a source near the top
function beam(x, half, color, a){
  // soft halo
  const gw = half*6;
  let g = ctx.createLinearGradient(x-gw,0,x+gw,0);
  g.addColorStop(0, rgba(color,0));
  g.addColorStop(.5, rgba(color, a*0.16));
  g.addColorStop(1, rgba(color,0));
  ctx.fillStyle=g; ctx.fillRect(x-gw,-HALF,gw*2,HALF*2);
  // bright core
  const core = mix(color, COLORS.white, .45);
  let c = ctx.createLinearGradient(x-half,0,x+half,0);
  c.addColorStop(0, rgba(color,0));
  c.addColorStop(.5, rgba(core, a));
  c.addColorStop(1, rgba(color,0));
  ctx.fillStyle=c; ctx.fillRect(x-half,-HALF,half*2,HALF*2);
}

// fixture source blob
function source(x, y, r, color, a){
  let g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, rgba(COLORS.white, a));
  g.addColorStop(.28, rgba(color, a*0.85));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}

function dot(x, y, r, color, a){
  let g = ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, rgba(COLORS.white, a));
  g.addColorStop(.4, rgba(color, a*0.9));
  g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
}

/* ============================================================
   PATTERN RENDERERS
   render(cue, t, master) — master = alpha multiplier for fades
   ============================================================ */
const SRC_Y = -HALF*0.0; // source sits at frame center-top after rotation feel
function srcY(){ return -HALF*0.62; }

function intA(cue){ return 0.12 + (cue.int/100)*0.9; }
function spd(cue){ return 0.0006 + (cue.spd/100)*0.004; }

const RENDER = {
  THIN(cue,t,m){
    const col=COLORS[cue.color], a=intA(cue)*m;
    const breathe = 0.72 + 0.28*Math.sin(t*spd(cue)*0.6);
    withRot(cue.rot, ()=>{
      beam(0, 5, col, a*breathe);
      source(0, srcY(), 70, col, a*breathe);
    });
  },

  BAR(cue,t,m){
    const col=COLORS[cue.color], a=intA(cue)*m;
    const N=7, gap=SPREAD*1.7/(N-1), x0=-SPREAD*0.85;
    const flow = t*spd(cue)*2.2;
    withRot(cue.rot, ()=>{
      for(let i=0;i<N;i++){
        const x=x0+gap*i;
        const w = 0.6 + 0.4*Math.sin(flow - i*0.7); // travelling brightness => direction/speed
        beam(x, 4, col, a*(0.45+0.55*w));
        source(x, srcY(), 34, col, a*(0.45+0.55*w));
      }
    });
  },

  GRADATION(cue,t,m){
    const col=COLORS[cue.color], a=intA(cue)*m;
    const N=11;
    const rush = (t*spd(cue)*1.6)%1;
    withRot(cue.rot, ()=>{
      for(let i=0;i<N;i++){
        const f=i/(N-1);
        // density rises toward right (perspective / acceleration)
        const x = -SPREAD + (SPREAD*2)*Math.pow(f,1.7);
        const dens = 0.35 + 0.65*f;
        // light sweeping outward
        const sweep = 0.5 + 0.5*Math.sin((f - rush)*Math.PI*2);
        beam(x, 3.4, col, a*dens*(0.5+0.5*sweep));
        source(x, srcY(), 26*(0.6+0.6*f), col, a*dens*0.9);
      }
    });
  },

  DOT(cue,t,m){
    const col=COLORS[cue.color], a=intA(cue)*m;
    const N=16, span=HALF*1.4, step=span/(N-1), y0=-span/2;
    const wave = t*spd(cue)*5.0;
    withRot(cue.rot, ()=>{
      // faint guide line
      beam(0, 1.4, col, a*0.10);
      for(let i=0;i<N;i++){
        const y=y0+step*i;
        const w = 0.5 + 0.5*Math.sin(wave - i*0.55); // size/intensity wave => 波を送る
        const r = 5 + 16*w;
        dot(0, y, r, col, a*(0.25+0.75*w));
      }
    });
  },

  DEPTHBAR(cue,t,m){
    const col=COLORS[cue.color], a=intA(cue)*m;
    const N=22, span=SPREAD*2.0, step=span/(N-1), x0=-span/2;
    const sweep = (t*spd(cue)*1.8)%1; // travelling band => 送り / 遠近
    withRot(cue.rot, ()=>{
      for(let i=0;i<N;i++){
        const x=x0+step*i;
        let d = ((i/N) - sweep); d-=Math.round(d); // wrap distance
        const band = Math.max(0, 1 - Math.abs(d)*7);
        const base = 0.18;
        beam(x, 2.4, col, a*(base + band*0.95));
        if(band>0.15) source(x, srcY(), 20+band*30, col, a*band);
      }
    });
  },

  WIDE(cue,t,m){
    const col=COLORS[cue.color], a=intA(cue)*m;
    const half = SPREAD*0.5;
    const sheen = 0.85 + 0.15*Math.sin(t*spd(cue)*1.4);
    withRot(cue.rot, ()=>{
      // massive band
      beam(0, half, col, a*0.9*sheen);
      // hot core
      beam(0, half*0.34, COLORS.white, a*0.55*sheen);
      source(0, srcY(), 140, col, a*sheen);
    });
  },
};

/* ============================================================
   MAIN LOOP
   ============================================================ */
let startT=performance.now();
function frame(now){
  const t = now - startT;
  // clear (dark, slight plum)
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#060309';
  ctx.fillRect(0,0,W,H);
  // vignette base glow
  ctx.globalCompositeOperation='lighter';

  if(trans.active){
    trans.t += 16/trans.dur;
    let k = Math.min(1, trans.t);
    const e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; // easeInOut
    const cFrom = cues[trans.from], cTo = cues[trans.to];
    if(cFrom) RENDER[cFrom.pattern](cFrom, t, (1-e));
    if(cTo)   RENDER[cTo.pattern](cTo, t, e);
    // blast pop when entering WIDE
    if(trans.blast>0){
      trans.blast*=0.9;
      withRot(cTo.rot,()=>{ beam(0, SPREAD*0.5, COLORS.white, trans.blast); });
    }
    if(k>=1){ trans.active=false; }
  } else {
    const c = cues[playhead];
    if(c) RENDER[c.pattern](c, t, 1);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   PLAYBACK
   ============================================================ */
function goTo(idx, instant){
  idx = (idx%cues.length+cues.length)%cues.length;
  if(idx===playhead && !instant) return;
  const from=playhead;
  playhead=idx;
  if(instant){ trans.active=false; }
  else{
    trans.from=from; trans.to=idx; trans.t=0; trans.active=true;
    trans.blast = (cues[idx].pattern==='WIDE') ? (cues[idx].int/100)*0.9 : 0;
  }
  syncPhase(); syncStack();
}
function advance(){
  const go=document.getElementById('go');
  go.classList.remove('flash'); void go.offsetWidth; go.classList.add('flash');
  let next=playhead+1;
  if(next>=cues.length){ if(!loop){ return; } next=0; }
  goTo(next,false);
  // if editing, keep editor following the live cue
  if(editorOpen){ selected=playhead; renderEditor(); }
}

/* ============================================================
   UI — phase readout
   ============================================================ */
function syncPhase(){
  const r=ROLES[playhead]||ROLES[0];
  document.getElementById('roleEn').textContent=r.en;
  document.getElementById('roleEn').style.color=r.c;
  document.getElementById('roleJp').textContent=r.jp;
  document.getElementById('roleIdx').textContent=`CUE ${String(playhead+1).padStart(2,'0')} / ${String(cues.length).padStart(2,'0')}`;
}

/* ============================================================
   UI — cue stack
   ============================================================ */
const stackEl=document.getElementById('stack');
function buildStack(){
  stackEl.innerHTML='';
  cues.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='cue'+(i===playhead?' live':'');
    el.draggable=true; el.dataset.i=i;
    const role=ROLES[i]||ROLES[0];
    const col=COLORS[c.color];
    el.innerHTML=`
      <div class="top-line">
        <div class="num">CUE ${String(i+1).padStart(2,'0')}</div>
        <div class="dot" style="background:${rgba(col,1)};color:${rgba(col,1)}"></div>
      </div>
      <div class="pat">${PATTERN_LABEL[c.pattern]}</div>
      <div class="role">${role.jp} · <b>${role.en}</b></div>
      <div class="meter"><i style="width:${c.int}%"></i></div>`;
    el.addEventListener('click',()=>{ selectCue(i); goTo(i,true); });
    addDrag(el);
    stackEl.appendChild(el);
  });
}
function syncStack(){
  [...stackEl.children].forEach((el,i)=>{
    el.classList.toggle('live', i===playhead);
    const c=cues[i];
    el.querySelector('.pat').textContent=PATTERN_LABEL[c.pattern];
    el.querySelector('.meter i').style.width=c.int+'%';
    const col=COLORS[c.color];
    el.querySelector('.dot').style.background=rgba(col,1);
    el.querySelector('.dot').style.color=rgba(col,1);
  });
}

/* drag to reorder */
let dragSrc=null;
function addDrag(el){
  el.addEventListener('dragstart',e=>{ dragSrc=+el.dataset.i; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); dragSrc=null;});
  el.addEventListener('dragover',e=>{ e.preventDefault();});
  el.addEventListener('drop',e=>{
    e.preventDefault();
    const tgt=+el.dataset.i;
    if(dragSrc===null||dragSrc===tgt) return;
    const moved=cues.splice(dragSrc,1)[0];
    cues.splice(tgt,0,moved);
    // keep playhead pointing at same visual cue if possible
    if(playhead===dragSrc) playhead=tgt;
    selected=-1; closeEditor();
    buildStack(); syncPhase();
  });
}

/* ============================================================
   UI — editor
   ============================================================ */
const editor=document.getElementById('editor');
const patWrap=document.getElementById('patbtns');
const colWrap=document.getElementById('colors');
const sInt=document.getElementById('sInt'),sSpd=document.getElementById('sSpd'),sRot=document.getElementById('sRot');
const vInt=document.getElementById('vInt'),vSpd=document.getElementById('vSpd'),vRot=document.getElementById('vRot');

PATTERNS.forEach(p=>{
  const b=document.createElement('button');
  b.className='patbtn'; b.dataset.p=p; b.textContent=PATTERN_LABEL[p];
  b.addEventListener('click',()=>{ if(selected<0)return; cues[selected].pattern=p; renderEditor(); syncStack(); });
  patWrap.appendChild(b);
});
COLOR_KEYS.forEach(k=>{
  const s=document.createElement('div');
  s.className='swatch'; s.dataset.c=k; s.style.background=rgba(COLORS[k],1);
  s.addEventListener('click',()=>{ if(selected<0)return; cues[selected].color=k; renderEditor(); syncStack(); });
  colWrap.appendChild(s);
});
sInt.addEventListener('input',()=>{ if(selected<0)return; cues[selected].int=+sInt.value; vInt.textContent=sInt.value; syncStack(); });
sSpd.addEventListener('input',()=>{ if(selected<0)return; cues[selected].spd=+sSpd.value; vSpd.textContent=sSpd.value; });
sRot.addEventListener('input',()=>{ if(selected<0)return; cues[selected].rot=+sRot.value; vRot.textContent=sRot.value+'°'; });
// double-click ROT slider => back to default -30°
sRot.addEventListener('dblclick',()=>{
  if(selected<0)return;
  cues[selected].rot=-30; sRot.value=-30; vRot.textContent='-30°';
});
// ALL => apply current cue's rotation to every cue
document.getElementById('rotAll').addEventListener('click',e=>{
  if(selected<0)return;
  const r=cues[selected].rot;
  cues.forEach(c=>c.rot=r);
  const b=e.currentTarget; b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
  b.blur();
});

/* size the editor to its actual content (no viewport-height clipping) */
function sizeEditor(){
  if(editorOpen) editor.style.maxHeight = editor.scrollHeight + 'px';
}
window.addEventListener('resize', sizeEditor);

function selectCue(i){
  selected=i; editorOpen=true; editor.classList.add('open');
  const et=document.getElementById('editToggle');
  et.classList.add('active'); et.textContent='DONE';
  document.getElementById('hint').style.opacity=0;
  renderEditor();
  sizeEditor();
}
function closeEditor(){
  editorOpen=false; editor.classList.remove('open'); editor.style.maxHeight=''; selected=-1;
  const et=document.getElementById('editToggle');
  et.classList.remove('active'); et.textContent='EDIT';
  document.getElementById('hint').style.opacity='';
}
function renderEditor(){
  if(selected<0) return;
  const c=cues[selected];
  patWrap.querySelectorAll('.patbtn').forEach(b=>b.classList.toggle('on',b.dataset.p===c.pattern));
  colWrap.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on',s.dataset.c===c.color));
  sInt.value=c.int; vInt.textContent=c.int;
  sSpd.value=c.spd; vSpd.textContent=c.spd;
  sRot.value=c.rot; vRot.textContent=c.rot+'°';
}

/* ============================================================
   TOOLBAR
   ============================================================ */
document.getElementById('go').addEventListener('click',e=>{ advance(); e.currentTarget.blur(); });
document.getElementById('rewind').addEventListener('click',()=>{ goTo(0,true); if(editorOpen){selected=0;renderEditor();} });
document.getElementById('reset').addEventListener('click',()=>{
  cues=defaultCues(); playhead=0; closeEditor(); buildStack(); syncPhase();
});
document.getElementById('loopBtn').addEventListener('click',e=>{
  loop=!loop; e.currentTarget.classList.toggle('active',loop);
});
document.getElementById('editToggle').addEventListener('click',()=>{
  if(editorOpen) closeEditor();
  else selectCue(playhead);
});

/* keyboard: SPACE = GO */
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    const ae=document.activeElement;
    if(ae && ae.tagName==='BUTTON') ae.blur();
    advance();
  }
  else if(e.code==='ArrowRight'){ goTo(playhead+1,true); }
  else if(e.code==='ArrowLeft'){ goTo(playhead-1,true); }
  else if(e.code==='Escape'){ closeEditor(); }
  else if(/Digit[1-6]/.test(e.code)){ const n=+e.code.slice(5)-1; if(n<cues.length){selectCue(n);goTo(n,true);} }
});

/* ============================================================
   BOOT
   ============================================================ */
resize();
buildStack();
syncPhase();
requestAnimationFrame(frame);
</script>
</body>
</html>
